# Default runtime configuration.
# Every key here can be overridden from the command line, e.g.
#   mvn clean test -Dheadless=false -Dbrowser=firefox
# Jenkins passes its build parameters the same way.

base.url=https://club.ministryoftesting.com/
search.query=skills

browser=chromium
headless=true
slowmo=0

# milliseconds
timeout.default=30000
timeout.navigation=45000

viewport.width=1920
viewport.height=1080

# retain-on-failure | always | never
capture.video=retain-on-failure
capture.trace=retain-on-failure
